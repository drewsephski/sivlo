<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where every word goes · Sivlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f2ec;
      --color-raised: #fbfaf6;
      --color-ink: #1b1915;
      --color-ink-soft: #55514a;
      --color-ink-faint: #6e6659;
      --color-rule: #ddd7c9;
      --color-accent: #1d5fd0;
      --color-accent-deep: #1749a6;
      --font-sans: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(2rem, 5vw, 4rem) 1.5rem;
    }
    .frame { max-width: 1180px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-ink-faint);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2rem, 4.5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }
    .lede {
      max-width: 58ch;
      color: var(--color-ink-soft);
      font-size: 1.0625rem;
      line-height: 1.6;
      margin-bottom: clamp(2.5rem, 5vw, 3.5rem);
    }
    .diagram-wrap {
      border: 1px solid var(--color-rule);
      border-radius: 2px;
      background: var(--color-paper);
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">fig. 00 · mechanism · data flow</p>
    <h1>Where every word goes.</h1>
    <p class="lede">
      The local pipeline on your Mac, read left to right: capture, mix, and
      transcribe on-device, with nothing ever leaving the boundary.
    </p>

    <figure class="diagram-wrap">
      <svg viewBox="0 0 1560 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sivlo-pipeline-title sivlo-pipeline-desc">
        <title id="sivlo-pipeline-title">Where every word goes — the Sivlo local pipeline</title>
        <desc id="sivlo-pipeline-desc">A left-to-right pipeline inside a dashed YOUR MAC boundary. 01 capture — Mic and System audio — feeds 02 mix (Mixer · 48 kHz), which forks into 03 transcribe (Whisper · on-device, cobalt) and 04 record (Recording · saved locally); both lanes drop into 05 remember, the working memory holding transcript, summary, actions and notes. Below the memory, a dotted connector drops to a cobalt 0 uploads seal with the lines no account · no telemetry and offline by design. An X on the boundary edge reads nothing crosses this line, and the cloud sits outside the frame labeled never involved.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55514a"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d5fd0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f2ec"/>

        <!-- top mono caption -->
        <text x="728" y="76" text-anchor="middle" fill="#6e6659" font-size="20" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">capture &nbsp;→&nbsp; mix &nbsp;→&nbsp; transcribe &nbsp;→&nbsp; remember</text>

        <!-- trust boundary -->
        <rect x="56" y="100" width="1344" height="600" rx="8" fill="none" stroke="rgba(27,25,21,0.40)" stroke-width="1" stroke-dasharray="5 4"/>
        <text x="84" y="140" fill="#1b1915" font-size="24" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" letter-spacing="0.08em">YOUR MAC</text>
        <text x="84" y="172" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">everything below happens on this device</text>

        <!-- arrows -->
        <line x1="264" y1="344" x2="352" y2="344" stroke="#55514a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="264" y1="488" x2="352" y2="488" stroke="#55514a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M576,360 H644 Q652,360 652,352 V272 Q652,264 660,264 H728" fill="none" stroke="#1d5fd0" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M576,504 H644 Q652,504 652,512 V560 Q652,568 660,568 H728" fill="none" stroke="#55514a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M960,264 H1020 Q1028,264 1028,272 V344 Q1028,352 1036,352 H1096" fill="none" stroke="#55514a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M960,584 H1020 Q1028,584 1028,576 V496 Q1028,488 1036,488 H1096" fill="none" stroke="#55514a" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1220" y1="528" x2="1220" y2="568" stroke="#6e6659" stroke-width="1" stroke-dasharray="4 4"/>

        <!-- stage tags -->
        <text x="92" y="288" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">01&nbsp;·&nbsp;capture</text>
        <text x="356" y="312" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">02&nbsp;·&nbsp;mix</text>
        <text x="732" y="208" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">03&nbsp;·&nbsp;transcribe</text>
        <text x="732" y="512" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">04&nbsp;·&nbsp;record</text>
        <text x="1120" y="356" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">05&nbsp;·&nbsp;remember</text>

        <!-- nodes -->
        <rect x="88" y="296" width="176" height="96" rx="6" fill="#ece8de" stroke="#6e6659" stroke-width="1"/>
        <text x="176" y="352" text-anchor="middle" fill="#1b1915" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">Mic</text>

        <rect x="88" y="440" width="176" height="96" rx="6" fill="#ece8de" stroke="#6e6659" stroke-width="1"/>
        <text x="176" y="496" text-anchor="middle" fill="#1b1915" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">System audio</text>

        <rect x="352" y="320" width="224" height="192" rx="6" fill="#1b1915" stroke="#1b1915" stroke-width="1"/>
        <text x="464" y="424" text-anchor="middle" fill="#fbfaf6" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">Mixer</text>
        <text x="464" y="452" text-anchor="middle" fill="rgba(251,250,246,0.72)" font-size="16" font-family="'IBM Plex Mono', monospace">48 kHz</text>

        <rect x="728" y="216" width="232" height="96" rx="6" fill="#1d5fd0" stroke="#1749a6" stroke-width="1.2"/>
        <text x="844" y="272" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">Whisper</text>
        <text x="844" y="300" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-size="16" font-family="'IBM Plex Mono', monospace">on-device</text>

        <rect x="728" y="520" width="232" height="96" rx="6" fill="#fbfaf6" stroke="#1b1915" stroke-width="1"/>
        <text x="844" y="576" text-anchor="middle" fill="#1b1915" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">Recording</text>
        <text x="844" y="604" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">saved locally</text>

        <rect x="1096" y="328" width="248" height="200" rx="6" fill="#eae7e1" stroke="#6e6659" stroke-width="1"/>
        <text x="1220" y="392" text-anchor="middle" fill="#1b1915" font-size="20" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">Working memory</text>
        <text x="1220" y="452" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">transcript&nbsp;·&nbsp;summary</text>
        <text x="1220" y="484" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">actions&nbsp;·&nbsp;notes</text>

        <rect x="1132" y="568" width="176" height="56" rx="28" fill="#1d5fd0" stroke="#1749a6" stroke-width="1.2"/>
        <text x="1220" y="604" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="600" font-family="'Schibsted Grotesk', sans-serif">0 uploads</text>
        <text x="1220" y="648" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">no account&nbsp;·&nbsp;no telemetry</text>
        <text x="1220" y="680" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">offline by design</text>

        <!-- nothing crosses this line -->
        <line x1="1392" y1="296" x2="1408" y2="320" stroke="#1b1915" stroke-width="2"/>
        <line x1="1408" y1="296" x2="1392" y2="320" stroke="#1b1915" stroke-width="2"/>
        <text x="1200" y="304" text-anchor="middle" fill="#55514a" font-size="16" font-family="'IBM Plex Mono', monospace">nothing crosses this line</text>

        <!-- the cloud -->
        <rect x="1436" y="320" width="116" height="88" rx="8" fill="#f3efe6" stroke="#c9c2b1" stroke-width="1"/>
        <text x="1494" y="352" text-anchor="middle" fill="#55514a" font-size="16" font-family="'IBM Plex Mono', monospace">the cloud</text>
        <text x="1494" y="388" text-anchor="middle" fill="#6e6659" font-size="16" font-family="'IBM Plex Mono', monospace">never involved</text>
      </svg>
    </figure>
  </div>
</body>
</html>

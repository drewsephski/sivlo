        .glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1150px;
          height: 1150px;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(47, 125, 246, 0.5) 0%, rgba(47, 125, 246, 0) 62%);
          opacity: 0;
          z-index: 1;
          will-change: transform, opacity;
        }
        .stack {
          position: relative;
          z-index: 2;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 56px;
        }
        .badge {
          position: relative;
          display: flex;
          align-items: center;
          gap: 34px;
          border: 4px solid #2f7df6;
          border-radius: 48px;
          background: #ffffff;
          padding: 42px 76px;
          font-size: 60px;
          font-weight: 600;
          color: #1f2937;
          will-change: transform, opacity;
        }
        .lock {
          width: 76px;
          height: 76px;
          flex: 0 0 76px;
        }
        .lock path {
          fill: none;
          stroke: #2f7df6;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .lock .body {
          fill: #ffffff;
          fill-opacity: 0;
        }
        .ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 520px;
          height: 160px;
          margin: -80px 0 0 -260px;
          border: 4px solid #2f7df6;
          border-radius: 80px;
          opacity: 0;
          will-change: transform, opacity;
        }
        .ring.echo {
          border-width: 2px;
          will-change: transform, opacity;
        }
        .badge-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 600px;
          height: 220px;
          margin: -110px 0 0 -300px;
          background: radial-gradient(ellipse, rgba(47, 125, 246, 0.5) 0%, rgba(47, 125, 246, 0) 70%);
          opacity: 0;
          z-index: 0;
          will-change: transform, opacity;
        }
        .badge-text {
          will-change: transform, opacity;
        }
        .sub {
          font-size: 42px;
          color: #6b7280;
          will-change: transform, opacity;

      </style>
      <div data-hf-id="hf-xl8x" id="root" data-composition-id="f05-privacy" data-width="1920" data-height="1080">
        <div data-hf-id="hf-j94s" class="glow" id="f5-glow"></div>
        <div data-hf-id="hf-d1zs" class="stack">
          <div data-hf-id="hf-r5zu" class="badge" id="f5-badge">
            <div data-hf-id="hf-bgl1" class="badge-glow" id="f5-badge-glow"></div>
            <svg data-hf-id="hf-p9qp" class="lock" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
              <path data-hf-id="hf-lhmk" id="f5-shackle" d="M 26 30 V 22 a 10 10 0 0 1 20 0 V 30" />
              <path data-hf-id="hf-sfgm" id="f5-body" class="body" d="M 19 30 h 34 v 26 a 6 6 0 0 1 -6 6 H 25 a 6 6 0 0 1 -6 -6 Z" />
            </svg>
            <span data-hf-id="hf-5g79" class="badge-text" id="f5-text">Nothing leaves your device</span>
            <div data-hf-id="hf-lo3u" class="ring" id="f5-ring"></div>
            <div data-hf-id="hf-rg2" class="ring echo" id="f5-ring2"></div>
          </div>
          <div data-hf-id="hf-5hzn" class="sub" id="f5-sub">Privacy isn’t a feature. It’s the product.</div>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const glow = document.getElementById("f5-glow");
        const phase = { p: 0 };
        tl.fromTo(
          "#f5-glow",
          { opacity: 0, scale: 0.8 },
          { opacity: 0.17, scale: 1, duration: 1.0, ease: "power2.out" },
          0.05,
        );
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 2,
            duration: 3.6,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(phase.p);
              glow.style.opacity = String(0.17 + s * 0.03);
            },
          },
          1.05,
        );

        ["#f5-shackle", "#f5-body"].forEach((sel) => {
          const p = document.querySelector(sel);
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });
        tl.fromTo(
          "#f5-badge",
          { scale: 0.94, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.12,
        );
        tl.to(
          "#f5-shackle",
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          0.35,
        );
        tl.to("#f5-body", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.to("#f5-body", { fillOpacity: 1, duration: 0.4, ease: "power1.out" }, 1.05);
        tl.fromTo(
          "#f5-text",
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          0.95,
        );
        tl.fromTo(
          "#f5-ring",
          { scale: 0.7, opacity: 0.45 },
          { scale: 1.35, opacity: 0, duration: 0.7, ease: "power2.out" },
          1.3,
        );
        tl.fromTo(
          "#f5-ring2",
          { scale: 0.8, opacity: 0.3 },
          { scale: 1.6, opacity: 0, duration: 1.1, ease: "power2.out" },
          1.7,
        );
        tl.fromTo(
          "#f5-badge-glow",
          { scale: 0.8, opacity: 0 },
          { scale: 1.15, opacity: 0.6, duration: 1.2, ease: "power2.out" },
          1.1,
        );
        tl.to("#f5-badge-glow", { opacity: 0, duration: 0.5, ease: "power1.in" }, 3.0);
        tl.fromTo(
          "#f5-sub",
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
          1.5,
        );

        window.__timelines["f05-privacy"] = tl;
      </script>
    </template>
